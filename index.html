<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <meta name="description" content="如水食单：每天整理下厨房的热门菜谱，用来找选题。打开就是最新一天，往下是更早的日子。">
  <meta name="application-name" content="如水食单">
  <meta property="og:title" content="如水食单">
  <meta property="og:description" content="每天整理下厨房的热门菜谱，打开就是最新一天。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <title>如水食单</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#days">跳到菜谱</a>

  <header class="mast">
    <div class="wrap mast-inner">
      <div class="brand">
        <svg class="seal" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="3.5" y="3.5" width="57" height="57" rx="8" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <rect x="8.5" y="8.5" width="47" height="47" rx="4" fill="none" stroke="currentColor" stroke-width="1.15"/>
          <path d="M24 22.5c2-3.4 5-3.4 6 .2 1.1-3.4 4-3.6 6.1-.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M18 30.5h28" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M20.5 30.5c1.1 9.2 6 15 11.5 15s10.4-5.8 11.5-15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <p class="eyebrow">下厨房 · 每日选题</p>
          <h1>如水食单</h1>
          <p class="tagline">打开就是最新一天，往下翻是更早的日子。</p>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <form class="wrap tools" id="tools" role="search">
      <div class="search">
        <svg class="mag" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M16 16.2 20 20.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <label class="sr-only" for="q">搜索菜名、用料或作者</label>
        <input id="q" type="search" placeholder="搜索菜名、用料或作者" autocomplete="off" enterkeyhint="search">
        <button type="button" class="clear" id="clear" hidden>清除</button>
      </div>
      <div class="filter-line">
        <span class="filter-label" id="cat-label">分类</span>
        <div class="chips" id="categories" role="group" aria-labelledby="cat-label"></div>
      </div>
      <div class="filter-line">
        <span class="filter-label" id="list-label">榜单</span>
        <div class="chips" id="lists" role="group" aria-labelledby="list-label"></div>
      </div>
      <p class="status" id="status" aria-live="polite">正在加载今天的菜谱…</p>
    </form>
  </div>

  <main class="wrap" id="feed">
    <div id="days" aria-busy="true">
      <div class="grid sk-grid" aria-hidden="true">
        <div class="sk"></div>
        <div class="sk"></div>
        <div class="sk"></div>
      </div>
    </div>
    <div class="empty" id="empty" hidden>
      <p id="empty-text">没有符合的菜谱。</p>
      <button type="button" id="reset">清除筛选</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>菜谱内容和图片版权归下厨房及原作者所有，本站仅作选题参考，点击可查看原文。</p>
    </div>
  </footer>

  <button type="button" class="to-top" id="to-top" hidden>顶部</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div id="detail" class="detail" hidden>
    <button type="button" class="detail-backdrop" id="detail-backdrop" aria-label="关闭"></button>
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button type="button" class="detail-close" id="detail-close">关闭</button>
      <div class="detail-layout">
        <div class="detail-photo" id="detail-photo"></div>
        <div class="detail-main">
          <div class="detail-scroll" id="detail-body"></div>
          <div class="detail-actions">
            <a class="btn btn-primary" id="detail-link" target="_blank" rel="noopener noreferrer">去下厨房看完整做法<span class="sr-only">（新窗口）</span></a>
            <button type="button" class="btn btn-secondary" id="detail-copy">复制菜名+用料</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <noscript>
    <p class="wrap noscript">需要打开 JavaScript 才能看每天的菜谱。</p>
  </noscript>
  <script src="app.js"></script>
</body>
</html>
